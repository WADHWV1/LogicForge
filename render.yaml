services:
  - type: web
    name: logicforge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 240
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LOGICFORGE_PROVIDER
        value: copilot
      - key: LOGICFORGE_ALLOWED_ORIGINS
        value: https://wadhwv1.github.io
      - key: LOGICFORGE_ACCESS_TOKEN
        generateValue: true
      - key: COPILOT_GITHUB_TOKEN
        sync: false
